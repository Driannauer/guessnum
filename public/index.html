<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f5ee" />
    <meta
      name="description"
      content="数字炸弹，16 次机会猜中四位数，支持单机和双人联机。"
    />
    <title>数字炸弹</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" data-cfasync="false" defer></script>
  </head>
  <body>
    <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="i-refresh" viewBox="0 0 24 24">
          <path
            d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 11-1l3 6M4 12l3 6a7 7 0 0 0 11-1"
          />
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
          <rect x="8" y="8" width="12" height="13" rx="2" />
          <path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
        </symbol>
        <symbol id="i-eye" viewBox="0 0 24 24">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="m6 6 12 12M6 18 18 6" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="m5 12 4 4L19 6" />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </symbol>
        <symbol id="i-lock" viewBox="0 0 24 24">
          <rect x="5" y="10" width="14" height="11" rx="2" />
          <path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3" />
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
          <path
            d="m9 3-.7 2.6-2.2 1.3-2.6-.6-3 5.2 1.8 2v2.6l-1.8 2 3 5.2 2.6-.6 2.2 1.3.7 2.6h6l.7-2.6 2.2-1.3 2.6.6 3-5.2-1.8-2v-2.6l1.8-2-3-5.2-2.6.6-2.2-1.3L15 3Z"
            transform="translate(2 0) scale(.83)"
          />
          <circle cx="12" cy="12" r="3" />
        </symbol>
      </defs>
    </svg>
    <main class="game-shell" aria-label="数字炸弹游戏">
      <button
        id="settings-button"
        class="icon-button settings-button"
        data-action="settings"
        aria-label="设置"
        title="设置"
        aria-haspopup="dialog"
      >
        <svg class="icon"><use href="#i-settings" /></svg>
      </button>
      <div
        id="game-panel"
        class="game-panel"
        role="region"
        aria-label="游戏区域"
      >
        <div class="input-panel loading" aria-label="正在连接">
          <span class="loader"></span>
        </div>
      </div>
    </main>
    <div class="portrait-prompt" role="status">
      <span class="phone-outline" aria-hidden="true"></span>
      <span>请竖屏</span>
    </div>
    <div
      id="dial-palette"
      class="dial-palette"
      role="group"
      aria-label="数字填充颜色"
      hidden
    >
      <button
        type="button"
        class="color-swatch"
        data-action="dial-color"
        data-color="blue"
        aria-label="蓝色"
        title="蓝色"
        aria-pressed="false"
      >
        <svg class="icon" aria-hidden="true"><use href="#i-check" /></svg>
      </button>
      <button
        type="button"
        class="color-swatch"
        data-action="dial-color"
        data-color="yellow"
        aria-label="黄色"
        title="黄色"
        aria-pressed="false"
      >
        <svg class="icon" aria-hidden="true"><use href="#i-check" /></svg>
      </button>
      <button
        type="button"
        class="color-clear"
        data-action="dial-color"
        data-color=""
        aria-label="清除颜色"
        title="清除颜色"
      >
        <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
      </button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="modal" class="modal" aria-labelledby="modal-title">
      <div id="modal-content"></div>
    </dialog>
    <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  </body>
</html>
